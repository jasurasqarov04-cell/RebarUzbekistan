<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Rebar Market</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- HEADER -->
  <header class="top-bar">
    <div class="logo-wrap"><img src="Rebar.png" alt="Logo" id="logo"></div>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <a class="cart-link" href="checkout.html">
      <div class="cart-icon-wrap">🛒</div>
      <span class="cart-badge" id="cartBadge">0</span>
    </a>
  </header>

  <!-- SEARCH -->
  <div class="search-wrap">
    <input id="search" type="text" data-i18n-ph="search"/>
  </div>

  <!-- CATEGORY TABS -->
  <div class="cat-tabs" id="catTabs"></div>

  <!-- CATALOG -->
  <div id="catalog">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item active" data-page="home" href="index.html">
      <span class="nav-icon">🏠</span>
      <span data-i18n="nav_home">Asosiy</span>
    </a>
    <a class="nav-item" data-page="cart" href="checkout.html">
      <span class="nav-icon">🛒</span>
      <span data-i18n="nav_cart">Savat</span>
      <span class="nav-badge" id="navCartBadge" style="display:none">0</span>
    </a>
    <a class="nav-item" data-page="favorites" href="favorites.html">
      <span class="nav-icon">❤️</span>
      <span data-i18n="nav_favorites">Sevimli</span>
    </a>
    <a class="nav-item" data-page="about" href="about.html">
      <span class="nav-icon">ℹ️</span>
      <span data-i18n="nav_about">Biz haqida</span>
    </a>
  </nav>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
