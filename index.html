<!-- ========= ШАПКА ========= -->
<header class="top-bar">
  <div class="logo-wrap">
    <img src="logo.png" alt="Logo" id="logo">
  </div>

  <div class="cart-widget" id="cartWidget">
    <button class="cart-btn">
      🛒 <span class="cart-badge" id="cartBadge">0</span>
    </button>
    <div class="cart-drop" id="cartDrop">
      <div class="cart-head">Корзина</div>
      <ul id="cartListDrop"></ul>
      <div class="cart-total" id="cartTotalDrop">0 сум</div>
      <button id="checkoutDrop">Оформить заказ</button>
    </div>
  </div>
</header>

<!-- поиск остаётся -->
<input id="search" type="text" placeholder="Поиск товаров…">

<section id="catalog"></section>

<!-- форма заказа (показывается по клику на кнопку в корзине) -->
<form id="orderForm" style="display:none;">
  <input id="name"  placeholder="Имя" required>
  <input id="phone" placeholder="Телефон" required>
  <button type="submit">Отправить заказ</button>
</form>
