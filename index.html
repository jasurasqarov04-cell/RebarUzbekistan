<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#15130F">
  <title>Rebar Market — Composite Reinforcement</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="top-bar">
    <a class="logo-wrap" href="index.html">
      <span class="logo-mark"><img src="Rebar.png" alt="Logo" id="logo"></span>
      <span class="logo-text">
        <span class="logo-text-main">REBAR</span>
        <span class="logo-text-sub">Uzbekistan</span>
      </span>
    </a>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero" data-parallax-container>
    <div class="hero-bg">
      <span class="hero-blob b1" data-depth="0.45"></span>
      <span class="hero-blob b2" data-depth="0.30"></span>
      <span class="hero-blob b3" data-depth="0.60"></span>
      <span class="hero-bars" data-depth="0.12"></span>
    </div>
    <div class="hero-content">
      <span class="hero-eyebrow"><span class="dot"></span><span data-i18n="hero_badge">Ishlab chiqaruvchi</span></span>
      <h1 class="hero-h"><span data-i18n="hero_h1">Kompozit armatura</span><br><span class="accent" data-i18n="hero_h2">va to'rlar</span></h1>
      <p class="hero-d" data-i18n="hero_desc">Bazalt va shisha-kompozit armatura, polad o'rnini bosadigan zamonaviy mustahkam yechim.</p>
      <div class="hero-actions">
        <a href="#catalog" class="btn-red"><span data-i18n="hero_cta1">Katalogga o'tish</span></a>
        <a href="about.html" class="btn-ghost-light"><span data-i18n="hero_cta2">Biz haqida</span></a>
      </div>
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="hero-stat-num"><span data-count="3" data-suffix="">0</span><span class="u">×</span></div>
          <div class="hero-stat-lbl" data-i18n="hero_stat1">Mustahkamroq po'latga</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-num"><span data-count="9" data-suffix="">0</span><span class="u">×</span></div>
          <div class="hero-stat-lbl" data-i18n="hero_stat2">Engilroq</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-num"><span data-count="80" data-suffix="">0</span><span class="u">+ yil</span></div>
          <div class="hero-stat-lbl" data-i18n="hero_stat3">Xizmat muddati</div>
        </div>
      </div>
    </div>
  </section>

  <!-- SEARCH -->
  <div class="search-wrap">
    <input id="search" type="text" data-i18n-ph="search"/>
  </div>

  <!-- CATEGORY TABS -->
  <div class="cat-tabs" id="catTabs"></div>

  <!-- SECTION LABEL -->
  <div class="section-label" id="catalogHeading"><span data-i18n="catalog_label">Mahsulotlar katalogi</span></div>

  <!-- CATALOG -->
  <div id="catalog">
    <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w-50"></div><div class="skeleton-line w-80"></div><div class="skeleton-line w-50"></div></div></div>
    <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w-50"></div><div class="skeleton-line w-80"></div><div class="skeleton-line w-50"></div></div></div>
    <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w-50"></div><div class="skeleton-line w-80"></div><div class="skeleton-line w-50"></div></div></div>
    <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w-50"></div><div class="skeleton-line w-80"></div><div class="skeleton-line w-50"></div></div></div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item active" data-page="home" href="index.html">
      <span class="nav-icon" data-icon="home"></span>
      <span data-i18n="nav_home">Asosiy</span>
    </a>
    <a class="nav-item" data-page="cart" href="checkout.html">
      <span class="nav-icon" data-icon="cart"></span>
      <span data-i18n="nav_cart">Savat</span>
      <span class="nav-badge" id="navCartBadge" style="display:none">0</span>
    </a>
    <a class="nav-item" data-page="favorites" href="favorites.html">
      <span class="nav-icon" data-icon="heart"></span>
      <span data-i18n="nav_favorites">Sevimli</span>
    </a>
    <a class="nav-item" data-page="about" href="about.html">
      <span class="nav-icon" data-icon="info"></span>
      <span data-i18n="nav_about">Biz haqida</span>
    </a>
  </nav>

  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="animations.js"></script>
  <script src="app.js"></script>
</body>
</html>
