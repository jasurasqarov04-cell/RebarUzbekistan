<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Rebar Market – доставка продуктов</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>Rebar Market</h1>
    <input id="search" type="text" placeholder="Поиск товаров…"/>
  </header>

  <section id="catalog"></section>

  <aside id="cartBlock">
    <h2>Корзина <span id="total">0 сум</span></h2>
    <ul id="cartList"></ul>
    <button id="checkout">Оформить заказ</button>
  </aside>

  <form id="orderForm" style="display:none;">
    <input id="name"  placeholder="Имя" required/>
    <input id="phone" placeholder="Телефон" required/>
    <button type="submit">Отправить заказ</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
