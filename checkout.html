<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#15130F">
  <meta name="description" content="Checkout — Rebar Market">
  <meta name="format-detection" content="telephone=no">
  <title>Cart · Rebar Market</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="Rebar.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="top-bar">
    <a class="back-link" href="index.html">
      <span class="nav-icon" data-icon="back"></span>
      <span data-i18n="back">Ortga</span>
    </a>
    <h1 class="header-title" data-i18n="cart_title">Savat</h1>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="page-content" id="checkoutRoot" data-step="1">

    <!-- STEPPER -->
    <nav class="stepper" aria-label="Checkout steps">
      <button type="button" class="stepper-item is-active" data-step-go="1">
        <span class="stepper-num">1</span>
        <span class="stepper-label" data-i18n="step_cart">Savat</span>
      </button>
      <button type="button" class="stepper-item" data-step-go="2" disabled>
        <span class="stepper-num">2</span>
        <span class="stepper-label" data-i18n="step_data">Ma'lumotlar</span>
      </button>
      <button type="button" class="stepper-item" data-step-go="3" disabled>
        <span class="stepper-num">3</span>
        <span class="stepper-label" data-i18n="step_done">Tayyor</span>
      </button>
    </nav>

    <!-- STEP 1 — CART -->
    <section class="step-panel" data-step-panel="1">
      <div id="checkoutCart"></div>
      <div id="cartActions" class="cart-actions" hidden>
        <button type="button" class="submit-btn" id="goToDataBtn">
          <span data-i18n="place_order">Buyurtma berish</span>
          <span data-icon="arrowRight" style="display:inline-flex;width:18px;height:18px;"></span>
        </button>
        <a href="index.html" class="add-more-btn">
          <span data-icon="plus" style="display:inline-flex;width:16px;height:16px;"></span>
          <span data-i18n="add_more">Yana qo'shish</span>
        </a>
      </div>
    </section>

    <!-- STEP 2 — DATA -->
    <section class="step-panel" data-step-panel="2" hidden>
      <form id="orderForm">
        <div class="order-form reveal in-view">
          <div class="step-hint" data-i18n="step_data_hint">Iltimos, ma'lumotlaringizni kiriting</div>
          <input class="form-field" id="name"  type="text"
                 data-i18n-ph="name_placeholder"  required autocomplete="name"/>
          <input class="form-field" id="phone" type="tel"
                 data-i18n-ph="phone_placeholder" required autocomplete="tel"/>
          <div class="step-mini-summary">
            <span class="ct-label" data-i18n="total">Jami</span>
            <span class="ct-value" id="dataStepTotal">0</span>
          </div>
          <button type="submit" class="submit-btn" id="submitBtn">
            <span data-i18n="submit_order">Buyurtma yuborish</span>
            <span data-icon="check" style="display:inline-flex;width:18px;height:18px;"></span>
          </button>
          <button type="button" class="add-more-btn" id="backToCartBtn">
            <span data-icon="back" style="display:inline-flex;width:16px;height:16px;"></span>
            <span data-i18n="step_back_cart">Savatga qaytish</span>
          </button>
        </div>
      </form>
    </section>

    <!-- STEP 3 — DONE -->
    <section class="step-panel" data-step-panel="3" hidden>
      <div class="step-done-card reveal in-view">
        <div class="step-done-icon">
          <span data-icon="check"></span>
        </div>
        <h2 class="step-done-title" data-i18n="order_sent_title">Buyurtma yuborildi!</h2>
        <p class="step-done-text" data-i18n="order_sent">Buyurtma yuborildi! Tez orada siz bilan bog'lanamiz.</p>
        <a href="index.html" class="submit-btn" style="margin-top:18px;text-decoration:none;">
          <span data-i18n="keep_shopping">Katalogni ko'rish</span>
          <span data-icon="arrowRight" style="display:inline-flex;width:18px;height:18px;"></span>
        </a>
      </div>
    </section>

  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item" data-page="home" href="index.html">
      <span class="nav-icon" data-icon="home"></span>
      <span data-i18n="nav_home">Asosiy</span>
    </a>
    <a class="nav-item active" data-page="cart" href="checkout.html">
      <span class="nav-icon" data-icon="cart"></span>
      <span data-i18n="nav_cart">Savat</span>
    </a>
    <a class="nav-item" data-page="favorites" href="favorites.html">
      <span class="nav-icon" data-icon="heart"></span>
      <span data-i18n="nav_favorites">Sevimli</span>
    </a>
    <a class="nav-item" data-page="about" href="about.html">
      <span class="nav-icon" data-icon="info"></span>
      <span data-i18n="nav_about">Biz haqida</span>
    </a>
  </nav>

  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="animations.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
