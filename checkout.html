<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Savat – Rebar Market</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- HEADER -->
  <header class="top-bar">
    <a class="back-link" href="index.html">
      <span class="nav-icon" data-icon="back"></span>
      <span data-i18n="nav_home">Asosiy</span>
    </a>
    <h1 class="header-title" data-i18n="cart_title">Savat</h1>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="page-content">
    <div id="checkoutCart"></div>

    <form id="orderForm" style="display:none">
      <div class="order-form">
        <h2 class="form-title" data-i18n="order_title">Buyurtma berish</h2>
        <input class="form-field" id="name"  type="text"
               data-i18n-ph="name_placeholder"  required/>
        <input class="form-field" id="phone" type="tel"
               data-i18n-ph="phone_placeholder" required/>
        <button type="submit" class="submit-btn" data-i18n="submit_order">Buyurtma yuborish</button>
      </div>
    </form>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item" data-page="home" href="index.html">
      <span class="nav-icon" data-icon="home"></span>
      <span data-i18n="nav_home">Asosiy</span>
    </a>
    <a class="nav-item active" data-page="cart" href="checkout.html">
      <span class="nav-icon" data-icon="cart"></span>
      <span data-i18n="nav_cart">Savat</span>
    </a>
    <a class="nav-item" data-page="favorites" href="favorites.html">
      <span class="nav-icon" data-icon="heart"></span>
      <span data-i18n="nav_favorites">Sevimli</span>
    </a>
    <a class="nav-item" data-page="about" href="about.html">
      <span class="nav-icon" data-icon="info"></span>
      <span data-i18n="nav_about">Biz haqida</span>
    </a>
  </nav>

  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
